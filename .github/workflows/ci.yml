name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and check formatting
        run: npm run lint && npm run format:check

      - name: Verify test discovery
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(test/*.test.js)

          if (( ${#tests[@]} == 0 )); then
            echo "::error::No test/*.test.js files were discovered"
            exit 1
          fi

          printf 'Discovered %d test files\n' "${#tests[@]}"
          printf ' - %s\n' "${tests[@]}"

      - name: Run tests
        run: npm test

      - name: Validate Worker bundle without deployment
        run: npm run build:check
